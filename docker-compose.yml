services:
  myapp:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - traefik-public
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.popnsbeach-menu.rule=Host(`popnsbeach.com`) || Host(`www.popnsbeach.com`)"
      - "traefik.http.routers.popnsbeach-menu.entrypoints=websecure"
      - "traefik.http.routers.popnsbeach-menu.tls.certresolver=letsencrypt"
      - "traefik.http.services.popnsbeach-menu.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true