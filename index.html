<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/popns_resets.css">
	<link rel="stylesheet" href="assets/css/popns_custom.css">
	<title>POPNS Beach</title>
	<meta property="og:title" content="POPNS Beach">
	<meta property="og:description" content="Made for life by the beach.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://popnsbeach.com/">
	<meta property="og:image" content="assets/imgs/POPNS-OG-IMAGE.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="POPNS Beach Menu" />
    <meta property="og:image:type" content="image/jpg" />
    <meta property="og:site_name" content="POPNS Beach" />
</head>
<body>
    <div id="popns_main">

        <header class="popns_header">

            <div class="popns_logo">
                <img src="assets/imgs/popns_beach_logo_web.svg" alt="POPNS Logo" width="200" height="100">
            </div>
            <button class="popns_menu_toggle" type="button" aria-label="Open menu" aria-controls="popns_menu" aria-expanded="false">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M0.5 7h23M0.5 12h23M0.5 17h23" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                </svg>
            </button>
        </header>

        <dialog class="popns_menu" id="popns_menu" aria-label="Main menu">
            <button class="popns_menu_close" type="button" aria-label="Close menu" autofocus>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m6 6 12 12M6 18 18 6" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
                </svg>
            </button>
            <nav class="popns_nav" aria-label="Main navigation">
                <ul>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </dialog>

        <div class="content">
            <header>
                <div class="page_title">
                    <h1>MENU</h1>
                </div>
                <div id="tabs" role="region" aria-label="Menu categories" tabindex="0">
                    <div class="tab active" data-tab="fresh_blends">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Fresh_Blends.png" alt="Fresh Blends Icon" width="50" height="50">
                        </div>
                        <p>Fresh Blends</p>
                    </div>
                    <div class="tab" data-tab="fresh_juices">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Fresh_Juices.png" alt="Fresh Juices Icon" width="50" height="50">
                        </div>
                        <p>Fresh Juices</p>
                    </div>
                    <div class="tab" data-tab="breakfast">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Breakfast.png" alt="Breakfast Icon" width="50" height="50">
                        </div>
                        <p>Breakfast</p>
                    </div>
                    <div class="tab" data-tab="bowls">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Bowls.png" alt="Bowls Icon" width="50" height="50">
                        </div>
                        <p>Bowls</p>
                    </div>
                    <div class="tab" data-tab="snacks">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Snacks.png" alt="Snacks Icon" width="50" height="50">
                        </div>
                        <p>Snacks</p>
                    </div>
                    <div class="tab" data-tab="sandwiches">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Sandwiches.png" alt="Sandwiches Icon" width="50" height="50">
                        </div>
                        <p>Sandwiches</p>
                    </div>
                    <div class="tab" data-tab="desserts">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Desserts.png" alt="Desserts Icon" width="50" height="50">
                        </div>
                        <p>Desserts</p>
                    </div>
                    <div class="tab" data-tab="coffee">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Coffee.png" alt="Coffee Icon" width="50" height="50">
                        </div>
                        <p>Coffee</p>
                    </div>
                    <div class="tab" data-tab="matcha">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Matcha.png" alt="Matcha Icon" width="50" height="50">
                        </div>
                        <p>Matcha</p>
                    </div>
                    <div class="tab" data-tab="water">
                        <div class="tab_icon">
                            <img src="menu_imgs/tabs/tabs_highlight_Water.png" alt="Water Icon" width="50" height="50">
                        </div>
                        <p>Water</p>
                    </div>
                </div>
            </header>


            <div class="popns_menu_section">

                <div class="section_pattern">
                    <div class="popns_pattern">
                        <img src="assets/imgs/popns_pattern_1.png" alt="POPNS Beach Pattern" width="50" height="100">
                    </div>
                    <h2>Fresh Blends</h2>
                </div>

                <div class="menu_container">
                    <img src="menu_imgs/tropical_supply.jpg" alt="Fresh Blends" width="1000" height="1000">
                    <div class="item_title">
                        <h4>Tropical Supply</h4>
                        <h4 class="price">50</h4>
                    </div>
                    <p class="description">Mango, peach, passion fruit, pineapple, strawberry & coconut water.</p>
                    <dl class="nutrition">
                        <dt>kcal</dt>
                        <dd>245</dd>
                        <dt>protein</dt>
                        <dd>4</dd>
                        <dt>carbs</dt>
                        <dd>60</dd>
                        <dt>fat</dt>
                        <dd>2</dd>
                    </dl>
                </div>

            </div>



        </div>
    </div>


<script src="assets/js/popns_tabs_carousel.js" defer></script>
<script src="assets/js/popns_menu.js" defer></script>
</body>
</html>
